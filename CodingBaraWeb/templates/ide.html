{% extends 'layout.html' %}
{% load static %}

{% block title %}IDE{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/ide.css' %}">

<div id="editor-container">
    <h2>Submit Your Code</h2>

    <form method="POST" action="/ide/">
        {% csrf_token %}
        
        {{ form.code }}
        
        <button type="submit">Submit</button>
    </form>
</div>
{% endblock %}
