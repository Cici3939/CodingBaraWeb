<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}
            Django App
        {% endblock %}
    </title>
    <link rel="stylesheet" href="{% static 'css/layout.css' %}">
    <script src="{% static 'js/main.js' %}" defer></script>
</head>
<body>
    <nav>
        <a href="/"><img src="{% static 'img/Capy Login.png' %}" alt="Home"></a> | 
        <a href="/ide"><img src="{% static 'img/Capybot.png' %}" alt="IDE"></a>
    </nav>
    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
